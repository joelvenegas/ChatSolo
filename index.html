<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Libreria lunar</title>
  <link rel="stylesheet" href="css/login.css">
</head>

<body>
  <div class="login-container">
    <div class="login-box">
      <h1>Libreria lunar</h1>
      
      <form id="loginForm" class="login-form">
        <div class="user-box">
          <input 
            id="email" 
            type="email" 
            placeholder=" "
            required
            autocomplete="email"
            inputmode="email"
          >
          <label for="email">Email</label>
        </div>

        <div class="user-box">
          <input 
            id="password" 
            type="password" 
            placeholder=" "
            required
            autocomplete="current-password"
          >
          <label for="password">Contraseña</label>
        </div>

        <button type="submit" id="loginBtn" class="login-btn">Ingresar</button>
      </form>

      <div id="error" class="error-message" role="alert" aria-live="polite"></div>
    </div>
  </div>

  <script type="module">
    import { login } from "./js/auth.js";
    
    const form = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const errorEl = document.getElementById("error");
    const loginContainer = document.querySelector(".login-container");

    // Manejo del teclado virtual en móviles
    function adjustViewportHeight() {
      const viewportHeight = window.visualViewport?.height || window.innerHeight;
      if (loginContainer) {
        loginContainer.style.minHeight = viewportHeight + "px";
      }
    }

    // Limpiar error cuando el usuario escribe
    [emailInput, passwordInput].forEach(input => {
      input.addEventListener("input", () => {
        if (errorEl && errorEl.classList.contains("show")) {
          errorEl.classList.remove("show");
          errorEl.textContent = "";
        }
      });
    });

    // Event listeners para cambios de viewport
    window.addEventListener("resize", adjustViewportHeight);
    window.addEventListener("orientationchange", () => {
      setTimeout(adjustViewportHeight, 100);
    });

    // Manejar cuando los inputs reciben focus
    [emailInput, passwordInput].forEach(input => {
      input.addEventListener("focus", () => {
        setTimeout(() => {
          input.scrollIntoView({ behavior: "smooth", block: "center" });
          adjustViewportHeight();
        }, 300);
      });

      input.addEventListener("blur", () => {
        setTimeout(adjustViewportHeight, 100);
      });
    });
    
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      loginBtn.disabled = true;
      login().finally(() => {
        loginBtn.disabled = false;
      });
    });

    // Inicializar altura en carga
    adjustViewportHeight();
  </script>
</body>
</html>
