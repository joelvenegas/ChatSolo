<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Chat</title>

<link rel="stylesheet" href="css/chat.css">

</head>
<body>

<div class="chat-container">

  <!-- Header -->
  <div class="chat-header">
    <h2>💬 Chat</h2>
    <button id="logoutBtn">Salir</button>
  </div>

  <!-- Mensajes -->
  <div id="mensajes" class="chat-messages"></div>

  <!-- Input -->
  <div class="chat-input">
    <input id="mensaje" placeholder="Escribí un mensaje...">
    <button id="sendBtn">➤</button>
  </div>

</div>

<script type="module">
import { checkAuth, logout } from "./js/auth.js";
import { enviarMensaje, escucharMensajes } from "./js/chat.js";

checkAuth();

document.getElementById("logoutBtn").onclick = logout;
document.getElementById("sendBtn").onclick = enviarMensaje;

// Enter para enviar
document.getElementById("mensaje").addEventListener("keydown", (e) => {
  if (e.key === "Enter") enviarMensaje();
});

escucharMensajes();
</script>

</body>
</html>
