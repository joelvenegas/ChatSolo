<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chat - ChatSolo</title>
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <h1>💬 ChatSolo</h1>
      <button id="logoutBtn" class="logout-btn" aria-label="Cerrar sesión">Salir</button>
    </header>

    <!-- Mensajes -->
    <div id="mensajes" class="chat-messages" role="log" aria-live="polite" aria-label="Mensajes del chat"></div>

    <!-- Input -->
    <footer class="chat-footer">
      <form id="chatForm" class="chat-input-form">
        <input 
          id="mensaje" 
          type="text"
          class="chat-input"
          placeholder="Escribe un mensaje..."
          autocomplete="off"
          aria-label="Campo para escribir mensaje"
          required
        >
        <button type="submit" id="sendBtn" class="send-btn" aria-label="Enviar mensaje">➤</button>
      </form>
    </footer>
  </div>

  <script type="module">
    import { checkAuth, logout } from "./js/auth.js";
    import { enviarMensaje, escucharMensajes } from "./js/chat.js";

    checkAuth();

    const logoutBtn = document.getElementById("logoutBtn");
    const chatForm = document.getElementById("chatForm");
    const sendBtn = document.getElementById("sendBtn");
    const chatContainer = document.querySelector(".chat-container");
    const chatFooter = document.querySelector(".chat-footer");
    const messageContainer = document.getElementById("mensajes");
    const messageInput = document.getElementById("mensaje");

    // Manejo del teclado virtual en móviles
    function adjustViewportHeight() {
      const viewportHeight = window.visualViewport?.height || window.innerHeight;
      if (chatContainer) {
        chatContainer.style.height = viewportHeight + "px";
      }
    }

    // Event listener para cambios de viewport
    let resizeTimeout;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        adjustViewportHeight();
      }, 100);
    });

    window.addEventListener("orientationchange", () => {
      setTimeout(adjustViewportHeight, 100);
    });

    // Manejar cuando el input recibe focus
    messageInput.addEventListener("focus", () => {
      setTimeout(() => {
        messageInput.scrollIntoView({ behavior: "smooth", block: "end" });
        chatFooter.scrollIntoView({ behavior: "smooth", block: "end" });
        adjustViewportHeight();
      }, 300);
    });

    // Manejar cuando el input pierde focus
    messageInput.addEventListener("blur", () => {
      setTimeout(adjustViewportHeight, 100);
    });

    logoutBtn.addEventListener("click", async () => {
      logoutBtn.disabled = true;
      await logout();
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      sendBtn.disabled = true;
      await enviarMensaje();
      sendBtn.disabled = false;
      messageInput.focus();
    });

    escucharMensajes();

    // Inicializar altura en carga
    adjustViewportHeight();
  </script>
</body>
</html>
