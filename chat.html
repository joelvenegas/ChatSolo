<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/styles.css">
  <title>Chat</title>
</head>
<body>

<div class="container">
  <h2>💬 Chat</h2>

  <button id="logoutBtn">Cerrar sesión</button>

  <input id="mensaje" placeholder="Escribí algo">
  <button id="sendBtn">Enviar</button>

  <ul id="lista"></ul>
</div>

<script type="module">
import { checkAuth, logout } from "./js/auth.js";
import { enviarMensaje, cargarMensajes } from "./js/chat.js";

checkAuth();

document.getElementById("logoutBtn").onclick = logout;
document.getElementById("sendBtn").onclick = enviarMensaje;

cargarMensajes();
</script>

</body>
</html>
